name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint
        
      - name: Run Prettier
        run: npm run format -- --check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run unit tests
        run: npm run test:unit
        
      - name: Run integration tests
        run: npm run test:integration
        
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript, python
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: aedi-platform/api:${{ github.sha }},aedi-platform/api:latest
          
      - name: Build and push Web image
        uses: docker/build-push-action@v4
        with:
          context: ./web-apps
          push: true
          tags: aedi-platform/web:${{ github.sha }},aedi-platform/web:latest
          
      - name: Build and push AI Service image
        uses: docker/build-push-action@v4
        with:
          context: ./ai-modules
          push: true
          tags: aedi-platform/ai:${{ github.sha }},aedi-platform/ai:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.aedi-platform.com
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f infrastructure/kubernetes/deployments/
          kubectl set image deployment/aedi-api aedi-api=aedi-platform/api:${{ github.sha }} -n aedi-platform
          kubectl set image deployment/aedi-ai-service aedi-ai=aedi-platform/ai:${{ github.sha }} -n aedi-platform
          
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/aedi-api -n aedi-platform
          kubectl rollout status deployment/aedi-ai-service -n aedi-platform

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://aedi-platform.com
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f infrastructure/kubernetes/deployments/
          kubectl set image deployment/aedi-api aedi-api=aedi-platform/api:${{ github.sha }} -n aedi-platform
          kubectl set image deployment/aedi-ai-service aedi-ai=aedi-platform/ai:${{ github.sha }} -n aedi-platform
          
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/aedi-api -n aedi-platform
          kubectl rollout status deployment/aedi-ai-service -n aedi-platform
          
      - name: Run smoke tests
        run: |
          curl -f https://aedi-platform.com/health || exit 1
          curl -f https://api.aedi-platform.com/health || exit 1
