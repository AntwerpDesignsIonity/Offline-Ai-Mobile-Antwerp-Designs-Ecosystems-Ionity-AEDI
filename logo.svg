<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#1a73e8" stroke="#0d47a1" stroke-width="3"/>
  
  <!-- Network Icon -->
  <g fill="#ffffff">
    <!-- Central Node -->
    <circle cx="100" cy="100" r="12"/>
    
    <!-- Outer Nodes -->
    <circle cx="60" cy="60" r="8"/>
    <circle cx="140" cy="60" r="8"/>
    <circle cx="60" cy="140" r="8"/>
    <circle cx="140" cy="140" r="8"/>
    
    <!-- Connection Lines -->
    <line x1="100" y1="100" x2="60" y2="60" stroke="#ffffff" stroke-width="3"/>
    <line x1="100" y1="100" x2="140" y2="60" stroke="#ffffff" stroke-width="3"/>
    <line x1="100" y1="100" x2="60" y2="140" stroke="#ffffff" stroke-width="3"/>
    <line x1="100" y1="100" x2="140" y2="140" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
        fill="#ffffff" text-anchor="middle">AEDI</text>
</svg>
