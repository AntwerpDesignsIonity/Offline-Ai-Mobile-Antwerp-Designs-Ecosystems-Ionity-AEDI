version: '3.8'

services:
  offline-ai-copilot:
    build: .
    container_name: offline-ai-copilot
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./models:/app/models
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge
